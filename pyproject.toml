[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cc-to-bob"
version = "0.1.0"
description = "Convert Claude Code Skills into IBM Bob Skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["claude", "ibm", "bob", "skill", "ai-agent", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = []   # zero runtime dependencies — stdlib only

[project.urls]
Homepage   = "https://github.com/your-org/cc-to-bob"
Repository = "https://github.com/your-org/cc-to-bob"
Issues     = "https://github.com/your-org/cc-to-bob/issues"

[project.scripts]
cc2bob       = "cc_to_bob.convert:cli"
cc2bob-restep = "cc_to_bob.restep:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cc_to_bob*"]

[tool.setuptools.package-data]
cc_to_bob = ["py.typed"]

# ── Dev / test tooling ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"
