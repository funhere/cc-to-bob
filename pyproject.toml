[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-to-bob"
version = "0.1.0"
description = "Convert Claude Code output to IBM Bob format"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
  {name = "funhere"}
]

dependencies = [
]

keywords = [
  "claude",
  "ibm-bob",
  "markdown",
  "converter",
  "ai-agent"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/funhere/cc-to-bob"

[project.scripts]
cc2bob = "cc_to_bob.cli:main"
cc2bob-restep = "cc_to_bob.restep:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
